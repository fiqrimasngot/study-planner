---
name: Release
# Publishes immutable images and updates the kube repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-planner-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and deploy
    if: github.repository == 'fiqrimasngot/study-planner' && github.ref == 'refs/heads/main'
    runs-on: study-planner-runners
    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Log in to Harbor
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: harbor.fiqriha.kim
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Verify current main before API publication
        run: &verify_current_main |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Refusing to publish or deploy a stale main revision" >&2
            exit 1
          fi

      - name: Build and publish API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: harbor.fiqriha.kim/library/study-planner-api:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify current main before web publication
        run: *verify_current_main

      - name: Build and publish web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: harbor.fiqriha.kim/library/study-planner-web:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Checkout kube repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fiqrimasngot/kube
          token: ${{ secrets.KUBE_REPO_TOKEN }}
          path: kube
          fetch-depth: 1
          persist-credentials: true

      - name: Update deployment references
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          python3 scripts/update_deployment.py \
            --tag "build-${GITHUB_SHA}" \
            --api-digest "${API_DIGEST}" \
            --web-digest "${WEB_DIGEST}" \
            --file kube/kubernetes/apps/default/study-planner/app/helmrelease.yaml

      - name: Validate rendered deployment
        run: |
          grep -F "tag: build-${GITHUB_SHA}@${{ steps.api.outputs.digest }}" kube/kubernetes/apps/default/study-planner/app/helmrelease.yaml
          grep -F "tag: build-${GITHUB_SHA}@${{ steps.web.outputs.digest }}" kube/kubernetes/apps/default/study-planner/app/helmrelease.yaml

      - name: Verify current main revision
        run: *verify_current_main

      - name: Commit and push deployment
        working-directory: kube
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kubernetes/apps/default/study-planner/app/helmrelease.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Deployment already references these images"
            exit 0
          fi
          git commit -m "deploy study planner ${GITHUB_SHA::12}"
          git push origin HEAD:main

      - name: Report immutable image references
        run: |
          echo "api=harbor.fiqriha.kim/library/study-planner-api:build-${GITHUB_SHA}@${{ steps.api.outputs.digest }}"
          echo "web=harbor.fiqriha.kim/library/study-planner-web:build-${GITHUB_SHA}@${{ steps.web.outputs.digest }}"
